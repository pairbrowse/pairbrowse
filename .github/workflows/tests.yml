# Tests on every push and pull request: the unit tests (the live browser tests skip without a
# runtime) and the property-based fuzzing of the security checks (test/fuzz).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # Known high or critical advisories in what ships, and the registry signatures of what npm ci installed.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit signatures
      - run: npm run lint
      - run: npm test
      - run: npm run test:fuzz
        env:
          PAIRBROWSE_FUZZ_RUNS: "20000"

  # The live tests: a real PairBrowse browser (headed, on a virtual screen), two of them for
  # joining. Coverage is measured here, child processes (the helper) included.
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Pinned browser runtime, as the plugin installs it
        working-directory: runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm audit signatures
      - name: Patchright's browser (the driver PairBrowse ships with), and a virtual screen
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb xauth
          node runtime/node_modules/patchright/cli.js install --with-deps chromium
          # Only for the test of the "playwright" opt-in (test/integration/driver-optin.test.mjs).
          node runtime/node_modules/playwright/cli.js install chromium
      # Server mode never starts the browser without its sandbox, which needs user namespaces: the
      # runner's AppArmor rule against unprivileged ones is lifted, as a server's host setting would
      # be (test/integration/server-display.test.mjs; spec server-mode U1). Nothing is turned off.
      - name: User namespaces for the browser's sandbox
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Unit and live tests, with coverage
        run: xvfb-run -a --server-args="-screen 0 1920x1200x24" npm run coverage
        env:
          PAIRBROWSE_TEST_RUNTIME: ${{ github.workspace }}/runtime
      - if: always()
        run: cat coverage/coverage-summary.json | jq '.total' && cat coverage/coverage-summary.json | jq -r 'to_entries[] | select(.key != "total") | "\(.value.statements.pct)\t\(.key)"' | sed "s|$GITHUB_WORKSPACE/||" | sort -n >> "$GITHUB_STEP_SUMMARY"
