<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PairBrowse</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="approve.css">
</head>
<body data-s="connecting" data-pending="0" data-driving="false">
<main id="main">
  <p class="empty" id="empty">Nothing is waiting for your OK.</p>
  <article class="card" id="card" tabindex="-1" aria-labelledby="title" aria-describedby="host reason" hidden>
    <header class="hd">
      <span id="avatar-slot"></span>
      <h1 class="title" id="title"><b id="who"></b> <span id="verb"></span></h1>
      <span class="count" id="count" role="status" hidden></span>
      <button class="x" id="dismiss" type="button" aria-label="Dismiss; it stays in the terminal">×</button>
    </header>
    <p class="target" id="target"></p>
    <p class="sr" id="host"></p>
    <p class="reason" id="reason" hidden></p>
    <div class="act">
      <button class="allow" id="allow" type="button">Allow</button>
      <button class="deny" id="deny" type="button">Deny</button>
      <button class="more" id="more" type="button" aria-expanded="false" aria-controls="menu">More actions <span aria-hidden="true">⌄</span></button>
    </div>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
    <div class="menu" id="menu" role="group" aria-label="More actions" hidden></div>
  </article>
</main>
<script type="module" src="approve.js"></script>
</body>
</html>
