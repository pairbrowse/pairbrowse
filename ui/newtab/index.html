<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>New tab</title>
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main>
    <img class="logo" src="../logo.svg" alt="" width="96" height="96">
    <h1>PairBrowse</h1>
    <form id="search" autocomplete="off">
      <input id="q" type="text" placeholder="Search or type a URL" aria-label="Search or type a URL" spellcheck="false" autofocus>
    </form>
    <nav class="chips" id="sessions" aria-label="Your other sessions" hidden></nav>
    <div class="ask" id="ask" role="group" aria-label="Switch while agents are at work" hidden></div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="newtab.js"></script>
</body>
</html>
