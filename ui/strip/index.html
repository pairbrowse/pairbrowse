<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>PairBrowse</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="strip.css">
</head>
<!-- The browser build's top strip: the tab row (no hash), the nav fragments beside the native
     address bar (#nav-left, #nav-right) and at the row's end, after the extensions button (#nav-end),
     and the Share card alone (#share) for the browser's Share bubble. One document; the hash picks
     what shows. -->
<body data-s="connecting" data-mode="row">
  <header id="row" class="row">
    <!-- The brand mark: the logo and the wordmark, static (no control: the sessions' door is the
         left dock's Sessions row). -->
    <div id="brand" class="brand">
      <img src="../logo.svg" alt="" width="28" height="28">
      <span class="wordmark">PairBrowse</span>
    </div>

    <ul id="tabs" role="tablist" aria-label="Tabs"></ul>
    <button id="new" type="button" aria-label="New tab">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>

    <div id="right">
      <span id="pill" role="status" aria-live="polite" data-state="connecting"><i class="dot live" aria-hidden="true"></i><span id="pill-text">Connecting to PairBrowse</span></span>
      <ul id="avatars" aria-label="In this session"></ul>
      <button id="share-btn" type="button" aria-expanded="false" aria-controls="share-card">
        <svg viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.8 9.2a2.6 2.6 0 0 0 3.7 0l2.3-2.3a2.6 2.6 0 0 0-3.7-3.7l-1 1"/><path d="M9.2 6.8a2.6 2.6 0 0 0-3.7 0L3.2 9.1a2.6 2.6 0 0 0 3.7 3.7l1-1"/></g></svg>
        Share
      </button>
      <div class="share-card pop m-pop" id="share-card" role="dialog" aria-labelledby="share-title" hidden>
        <h2 id="share-title">Share this session</h2>
        <fieldset class="share-choice"><legend>Invite</legend>
          <label class="share-opt"><input type="radio" name="share" value="code" checked><span>Join code<small>Shared browser, can drive</small></span></label>
          <label class="share-opt"><input type="radio" name="share" value="approve"><span>Join code, can approve<small>Can drive and answer your approval cards (pay, send, submit)</small></span></label>
          <label class="share-opt"><input type="radio" name="share" value="link"><span>Watch link<small>View only</small></span></label>
        </fieldset>
        <label class="share-name" id="share-name-row" hidden>Your first name <input class="field" id="share-name" maxlength="40" autocomplete="given-name"></label>
        <button class="primary" id="share-make" type="button">Make invite</button>
        <div class="share-result" id="share-result" hidden><div class="share-line"><input class="field share-code" id="share-code" readonly aria-label="The invite"><button class="mini" id="share-copy" type="button">Copy</button></div><p class="note" id="share-rights"></p></div>
        <p class="msg" id="share-msg" role="status" aria-live="polite"></p>
        <button class="x" id="share-close" type="button" aria-label="Close" hidden><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      </div>
      <p class="sr-note" id="share-note" role="status" aria-live="polite"></p>
      <button id="menu-btn" type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="12.5" cy="8" r="1.4" fill="currentColor"/></svg>
      </button>
      <div id="menu" class="pop m-pop" role="menu" aria-label="PairBrowse" hidden>
        <button class="item" id="settings" type="button" role="menuitem" tabindex="-1"><span>PairBrowse settings</span></button>
      </div>
    </div>
  </header>

  <nav id="nav-left" class="nav" aria-label="Navigation" hidden>
    <button id="back" type="button" disabled aria-label="Back (⌘[)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3.5M7.5 4 3.5 8l4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="forward" type="button" disabled aria-label="Forward (⌘])">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9.5M8.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="reload" type="button" aria-label="Reload (⌘R)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>

  <nav id="nav-right" class="nav" aria-label="Page tools" hidden>
    <button id="find" type="button" disabled aria-label="Find in page (⌘F)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.2 10.2 3.3 3.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </nav>

  <nav id="nav-end" class="nav" aria-label="Agent panel" hidden>
    <button id="sparkle" type="button" aria-pressed="false" aria-label="Agent panel">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8c.5 3.2 1.8 4.6 5.2 6.2-3.4 1.6-4.7 3-5.2 6.2-.5-3.2-1.8-4.6-5.2-6.2 3.4-1.6 4.7-3 5.2-6.2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
  </nav>
  <script type="module" src="strip.js"></script>
</body>
</html>
